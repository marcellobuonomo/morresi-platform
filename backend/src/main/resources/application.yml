spring:
  application:
    name: morresi-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/morresi}
    username: ${DB_USERNAME:morresi}
    password: ${DB_PASSWORD:morresi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # lo schema lo gestisce solo Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true        # errori in formato RFC 7807
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

springdoc:
  default-produces-media-type: application/json   # client Angular generati da /v3/api-docs (npm run api)

management:
  endpoints:
    web:
      exposure:
        include: health,info
